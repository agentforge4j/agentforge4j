<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-bootstrap:start
         Sets `data-theme` on the html element before the SPA's own bundle loads, so the correct
         palette is already painted on the first frame — never a light-then-dark (or reverse)
         flash while React mounts. Must run before any stylesheet or content paints, so it sits
         immediately after the charset/viewport metas and before everything else. It must NOT
         come before the charset meta: browsers only honour an in-document charset declaration
         found within the first 1024 bytes, and this script is large enough to push that meta
         past the limit — which matters to any host that serves this file without a charset in
         the Content-Type header (the em dash in the page title would then mojibake). NOTE for
         editors: keep this comment free of literal angle-bracket tag text — scripts/
         build-seo.mjs rewrites the built page's head via regexes anchored on the FIRST
         occurrence of each tag, so tag-like text in an earlier comment would be matched and
         splice the file apart. Deliberately a hand-written copy of theme.ts's
         resolveEffectiveTheme/currentThemeMode logic rather than an import: nothing here can
         import a bundled module, since this script IS what runs before any bundle exists. Kept
         in sync with theme.ts by tests/themeBootstrapScript.test.ts, which extracts this exact
         script and asserts it resolves identically to theme.ts for every representative input —
         change one, update the other, and let that test catch drift. The storage key literal
         below MUST match THEME_STORAGE_KEY in src/theme/theme.ts exactly. -->
    <script>
      (function () {
        var KEY = 'agentforge4j.theme';
        var mode = 'system';
        try {
          var stored = window.localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark' || stored === 'system') {
            mode = stored;
          }
        } catch (e) {
          /* localStorage unavailable/throwing — fall back to 'system', same as theme.ts. */
        }
        var dark = mode === 'dark';
        if (mode === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {
            /* matchMedia unavailable — fall back to light, same as theme.ts's default false. */
          }
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <!-- theme-bootstrap:end -->
    <title>AgentForge4j — Governed AI Workflows for Java</title>
    <meta
      name="description"
      content="AgentForge4j is an open-source Java framework for Java teams building their own governed AI workflows, with approvals, tools, and observability."
    />
    <link rel="canonical" href="https://agentforge4j.org/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AgentForge4j" />
    <meta property="og:url" content="https://agentforge4j.org/" />
    <meta property="og:title" content="AgentForge4j — Governed AI Workflows for Java" />
    <meta
      property="og:description"
      content="AgentForge4j is an open-source Java framework for Java teams building their own governed AI workflows, with approvals, tools, and observability."
    />
    <!-- NOTE for editors: this comment, like the theme-bootstrap one above, must stay free of
         literal angle-bracket tag text — scripts/build-seo.mjs rewrites the built page's head via
         regexes anchored on the FIRST occurrence of each tag, and this comment sits AHEAD of
         twitter:title and twitter:description, both of which it rewrites. Tag-like text here would
         be matched instead and splice the file apart.

         The dedicated 1280x640 social-preview card, not the 512x512 app icon: a square image is
         letterboxed or centre-cropped by every large-card renderer, and `summary_large_image` needs
         at least 1200x630 to be honoured at all. Declaring the real intrinsic width/height lets a
         crawler reserve the right aspect ratio before fetching the bytes; both values are gated
         against the real file's own PNG header by scripts/verify-seo.mjs, so they cannot drift into
         describing an image that is no longer that size. twitter:image below must name this same
         file, which scripts/verify-seo.mjs also asserts — only the Open Graph one is fetched and
         size-checked, so a mirror that disagreed with it would be unverified. Byte-identical to
         .github/assets/agentforge4j-social-preview.png, the committed record of the card uploaded
         to the repository's social-preview setting; see scripts/lint-brand-assets.mjs. -->
    <meta property="og:image" content="https://agentforge4j.org/brand/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The AgentForge4j logo and the words Governed AI Workflows" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgentForge4j — Governed AI Workflows for Java" />
    <meta
      name="twitter:description"
      content="AgentForge4j is an open-source Java framework for Java teams building their own governed AI workflows, with approvals, tools, and observability."
    />
    <meta name="twitter:image" content="https://agentforge4j.org/brand/social-preview.png" />
    <meta name="twitter:image:alt" content="The AgentForge4j logo and the words Governed AI Workflows" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
