name: CodeQL

# Static application security testing (SAST) for the Java codebase. Runs the CodeQL
# `security-extended` query suite on every push/PR to main and on a weekly schedule, and uploads
# the results to the repository's Security tab. Distinct from the CI build gate and the Gitleaks
# secret-scanning workflow.
#
# Code scanning is free on public repositories, so no GitHub Advanced Security subscription is
# needed. If this repository is ever made private again, the SARIF upload step will start
# failing unless GHAS is enabled for it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, Monday 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      # Required to upload CodeQL SARIF results to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          # java-kotlin is the canonical CodeQL identifier for JVM code. The repo is Java-only,
          # so build-mode "none" is valid; if Kotlin source is ever added, switch this to
          # autobuild/manual.
          languages: java-kotlin
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:java-kotlin"
