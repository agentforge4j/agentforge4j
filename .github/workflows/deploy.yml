name: Deploy Docs

# Publishes a temporary holding page to GitHub Pages while product naming is removed from the
# public site and docs pending rename. The previous full-site pipeline (SPA, documentation site,
# Javadoc surfaces, sitemap) is intentionally not built or published while the holding page is in
# effect — the served content is exactly the committed static files under site-holding/ and
# nothing else. The custom-domain binding lives in the repository's Pages settings, not in this
# artifact, and is unaffected by this workflow.
#
# `workflow_dispatch` lets a maintainer pick an arbitrary ref to run against (via the Actions UI,
# CLI, or API) — not just `main`. Both jobs below are guarded to `github.ref == 'refs/heads/main'`
# so a manual run against a feature/PR branch builds nothing and cannot publish to the production
# `github-pages` environment; only `main` may ever be deployed.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; do not cancel an in-progress deploy (Pages best practice).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    # Restricts production builds/deploys to `main` even when workflow_dispatch is run against
    # another ref (see the `on:` block comment above).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the Pages artifact (holding page only)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-holding

  deploy:
    name: deploy
    needs: build
    # Restricts production builds/deploys to `main` even when workflow_dispatch is run against
    # another ref (see the `on:` block comment above).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
